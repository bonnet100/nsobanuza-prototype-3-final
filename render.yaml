services:
  - type: web
    name: nsobanuza-web
    runtime: node
    buildCommand: npm install && npm run build:client
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: nsobanuza-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PHONE
        value: +250780000000
      - key: XAI_API_KEY
        sync: false
      - key: AI_PROVIDER_PREFERENCE
        value: xai
      - key: XAI_MODEL
        value: grok-3-mini
databases:
  - name: nsobanuza-db
